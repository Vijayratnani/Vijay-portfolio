name: Deploy to GitHub Pages

# Builds the static export and publishes it to https://vijayratnani.github.io/Vijay-portfolio/.
# Requires Settings → Pages → Source: "GitHub Actions" (a one-time, admin-only setting).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://vijayratnani.github.io/Vijay-portfolio
      # Flat copies of dynamic-route prefetch files, and no Jekyll (it would drop _next/).
      - run: node scripts/flatten-export-prefetch.mjs out && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
